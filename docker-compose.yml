services:
  db:
    image: pgvector/pgvector:pg17
    container_name: meeting_memory_db
    environment:
      POSTGRES_USER: ${PG_USER:-mm}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mm}
      POSTGRES_DB: ${PG_DB:-meeting_memory}
    ports:
      - "${PG_PORT:-5433}:5432"   # 5433 on the host so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mm} -d ${PG_DB:-meeting_memory}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
